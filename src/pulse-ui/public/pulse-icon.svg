<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A84FF"/>
      <stop offset="50%" style="stop-color:#007AFF"/>
      <stop offset="100%" style="stop-color:#5856D6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background matching iOS app icon shape -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- Subtle radial highlight -->
  <circle cx="180" cy="160" r="200" fill="rgba(255,255,255,0.06)"/>
  <!-- Main pulse/heartbeat line — bold, centered -->
  <polyline points="72,276 152,276 192,276 232,168 272,384 312,132 352,320 384,248 420,276 440,276"
            fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <!-- Subtle secondary pulse (thin, offset) for depth -->
  <polyline points="72,276 152,276 192,276 232,168 272,384 312,132 352,320 384,248 420,276 440,276"
            fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"
            transform="translate(0, 24)"/>
</svg>
