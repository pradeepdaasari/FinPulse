name: Build and Deploy FinPulse

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: finpulse-app
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/finpulse-ui/package-lock.json

      - name: Install Angular dependencies
        run: npm ci
        working-directory: src/finpulse-ui

      - name: Build Angular app
        run: npx ng build --configuration production
        working-directory: src/finpulse-ui

      - name: Publish .NET API
        run: dotnet publish src/FinPulse.Api/FinPulse.Api.csproj -c Release -o ./publish --nologo

      - name: Copy Angular build to wwwroot
        run: cp -r src/finpulse-ui/dist/finpulse-ui/browser/* ./publish/wwwroot/

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
